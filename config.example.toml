# opencode-rust configuration file
# Place this at: ~/.config/opencode-rust/config.toml
# Or set OPENCODE_RUST_CONFIG="path/to/config.toml"

[provider]
# OpenAI-compatible API endpoint:
# Examples:
#   OpenRouter: "https://openrouter.ai/api/v1"
#   OpenAI:     "https://api.openai.com/v1"
#   Groq:       "https://api.groq.com/openai/v1"
#   Ollama:     "http://127.0.0.1:11434/v1"
#   Gemini:     "https://generativelanguage.googleapis.com/v1beta/openai/"
#   Local Mock: "http://127.0.0.1:18080/v1"
base_url = "https://openrouter.ai/api/v1"

# Wire protocol: "openai" (default; any OpenAI-compatible server) or
# "anthropic" (Anthropic's own API). For Anthropic set
# base_url = "https://api.anthropic.com/v1", api = "anthropic",
# model = "claude-sonnet-5-5".
# api = "openai"

# Longest reply in tokens. Required by "anthropic", ignored by "openai".
# Claude's thinking counts toward it; raise it (e.g. 32000) if long file
# writes get cut off.
# max_tokens = 8192

# Your API key (can also be set via $env:OPENCODE_RUST_API_KEY):
api_key = "your-api-key-here"

# Model identifier:
# Examples: "openai/gpt-4o", "anthropic/claude-3.5-sonnet", "llama3.1", "mock"
model = "openai/gpt-4o"

# Optional cheaper model for background tasks (compaction, planning)
# small_model = "openai/gpt-4o-mini"
request_timeout_secs = 600

# Retries when the provider is busy or unreachable (HTTP 429/5xx or a
# connection error), waiting 1s, 2s, 4s... between tries. 0 = no retries.
max_retries = 3

[agent]
max_steps = 40
# Context window of your model in tokens; at ~80% the agent compacts older
# messages automatically. 0 = off. The Kaggle/Ollama setup uses 8192.
# context_tokens = 8192
ponytail = true
auto_review = true
reuse_gate = true

# F-05: give each `worker` subagent and team worker its own git worktree.
# Their changes come back as patch files; nothing lands in your files until
# the main agent (or you) applies the patch.
# isolate_workers = false

# F-08: check the work after every run that changed files (unset = off).
# On failure the agent gets the output and up to verify_max_rounds tries to fix it.
# verify_command = "cargo test"
# verify_max_rounds = 2
# verify_timeout_secs = 600

[permissions]
# Default action per tool: "allow" | "ask" | "deny"
[permissions.defaults]
# Letter case of the action word is ignored. Tools you leave out keep their
# built-in default. A typo in an action word stops the program at startup
# with an error that names the entry.
read = "allow"
list = "allow"
glob = "allow"
grep = "allow"
bash = "ask"
write = "ask"
edit = "ask"
webfetch = "ask"

# Rules are checked in order; the first match wins.
# For file tools the pattern is matched against the path relative to the
# workspace, with "/" separators ("src/main.rs"). "." and ".." are resolved
# first. Paths outside the workspace look like "outside:/abs/path".
# On Windows, file patterns ignore letter case.
# [[permissions.rules]]
# tool = "read"
# pattern = ".env"
# action = "deny"

# MCP servers (optional). Each runs as its own program; its tools reach the
# model as mcp__<name>__<tool>. Run each command once in a terminal first:
# the first start downloads packages and can take longer than the 20-second
# start-up limit. Remove the leading "# " to enable an entry.

# Context7 - current library docs (MIT). Needs Node.js. Optional API key for
# higher rate limits: set CONTEXT7_API_KEY before starting opencode-rust.
# Windows (npx is a .cmd script, so start it through cmd):
# [[mcp.servers]]
# name = "context7"
# command = "cmd"
# args = ["/c", "npx", "-y", "@upstash/context7-mcp"]
# macOS / Linux:
# [[mcp.servers]]
# name = "context7"
# command = "npx"
# args = ["-y", "@upstash/context7-mcp"]

# ast-grep - structural code search. Needs the ast-grep CLI and uv (uvx).
# [[mcp.servers]]
# name = "ast-grep"
# command = "uvx"
# args = ["--from", "git+https://github.com/ast-grep/ast-grep-mcp", "ast-grep-server"]
