name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep the "0 warnings" rule honest. If a new Rust release adds a lint that
  # breaks the build, fix the warning (or remove this line for a while).
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (full build, GUI included)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK/WebKit (needed by tao and wry)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --tests
      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs, so
      # headless Chrome (the check_page tests) exits before loading a page.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --locked

  linux-core:
    name: Linux (core only, no GUI feature)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --locked --no-default-features

  lint:
    name: Format + clippy (core, no GUI feature)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  lint-windows:
    name: Clippy (Windows, default features incl. GUI)
    # The core lint above never sees gui.rs, preview.rs or browser.rs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  audit:
    name: Dependency advisories (RustSec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows (full build + GUI page tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --tests
      - run: cargo test --locked
      - name: GUI page tests (headless Edge)
        # Not yet proven on GitHub runners: remove continue-on-error once green.
        continue-on-error: true
        shell: bash
        run: bash tests/gui/run.sh || [ $? -eq 2 ]
